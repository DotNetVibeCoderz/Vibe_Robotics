name: ROS2.Net

# CI for every change under ROS2.Net/, and NuGet publishing when a tag like ros2net-v0.1.0 is pushed
# (or when started manually with "publish" ticked). Uses the NUGET_API_KEY repository secret.

on:
  push:
    branches: [main]
    paths: ["ROS2.Net/**", ".github/workflows/ros2net.yml"]
    tags: ["ros2net-v*"]
  pull_request:
    paths: ["ROS2.Net/**", ".github/workflows/ros2net.yml"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish packages to NuGet"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ros2net-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ROS2.Net
    shell: bash

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    # Windows: the native Rust kernel, the headless Avalonia renders and the full test suite are verified there.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: ROS2.Net/global.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/ros2net-v* ]]; then
            echo "args=-p:Version=${GITHUB_REF#refs/tags/ros2net-v}" >> "$GITHUB_OUTPUT"
          else
            echo "args=-p:VersionSuffix=ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Native (Rust)
        run: |
          cargo test --release --manifest-path native/ros2net_native/Cargo.toml
          cargo build --release --manifest-path native/ros2net_native/Cargo.toml

      - name: Restore
        run: dotnet restore ROS2.Net.slnx

      - name: Build
        run: dotnet build ROS2.Net.slnx -c Release --no-restore ${{ steps.version.outputs.args }}

      - name: Test
        run: dotnet test ROS2.Net.slnx -c Release --no-build --logger "trx"

      - name: Pack
        run: dotnet pack ROS2.Net.slnx -c Release --no-build -o artifacts ${{ steps.version.outputs.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: ros2net-packages
          path: ROS2.Net/artifacts/*

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/ros2net-v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ros2net-packages
          path: packages

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Push to NuGet
        working-directory: packages
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push "*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
